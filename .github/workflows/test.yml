name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.19
      - run: uv sync --frozen --extra dev --extra map
      - run: BRUIN_BACKEND=rules uv run python -m pytest -q
      - run: uv run pip-audit --local --progress-spinner off
      - run: uv run bandit -q -r src api scripts -x tests
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test tests/test_navigation.mjs tests/test_online_world.mjs
