name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev,map]'
      - run: BRUIN_BACKEND=rules python -m pytest -q
      - run: pip-audit -r requirements.txt --progress-spinner off
      - run: bandit -q -r src api scripts -x tests
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: node --test tests/test_navigation.mjs tests/test_online_world.mjs
