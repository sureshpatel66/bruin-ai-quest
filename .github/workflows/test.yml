name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.19
      - run: uv sync --frozen --extra dev --extra map
      - run: BRUIN_BACKEND=rules uv run python -m pytest -q
      - run: uv run pip-audit --local --progress-spinner off
      - run: uv run bandit -q -r src api scripts -x tests
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: node --test tests/test_navigation.mjs tests/test_online_world.mjs
