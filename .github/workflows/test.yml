name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev,map]'
      - run: BRUIN_BACKEND=rules python -m pytest -q
      - run: pip-audit -r requirements.txt --progress-spinner off
      - run: bandit -q -r src api scripts -x tests
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test tests/test_navigation.mjs tests/test_online_world.mjs
